name: Refresh Criterion Closet archive

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-criterion-closet
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore archive metadata caches
        uses: actions/cache@v6
        with:
          path: .cache
          key: criterion-metadata-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            criterion-metadata-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Refresh live archive indexes
        run: npm run data:sync:indexes

      - name: Detect archive changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/films.json data/closet-videos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new or updated Closet releases." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "A new or updated Closet release was found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Add new director portraits
        if: steps.changes.outputs.changed == 'true'
        run: npm run data:people

      - name: Rebuild semantic profiles
        if: steps.changes.outputs.changed == 'true'
        run: npm run data:taste

      - name: Validate the refreshed archive
        if: steps.changes.outputs.changed == 'true'
        run: npm test

      - name: Commit the refreshed snapshot
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "criterion-closet-bot"
          git config user.email "criterion-closet-bot@users.noreply.github.com"
          git add data
          git commit -m "Refresh Criterion Closet archive"
          git push origin HEAD:main
